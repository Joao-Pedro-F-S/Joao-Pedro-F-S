<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" fill="none" role="img" aria-label="João Pedro França Silva — Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F14"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 40) scale(320 220)">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity=".30"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 300) scale(300 160)">
      <stop offset="0" stop-color="#10B981" stop-opacity=".20"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="300" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .line { opacity: 0; animation: in .5s ease forwards; }
      .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.1s; }
      .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } .cursor, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#bg)"/>
    <rect width="880" height="300" fill="url(#grid)"/>
    <rect width="880" height="300" fill="url(#glow)"/>
    <rect width="880" height="300" fill="url(#glow2)"/>

    <rect width="880" height="40" fill="#FFFFFF" fill-opacity=".03"/>
    <path d="M0 40H880" stroke="#FFFFFF" stroke-opacity=".07"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="20" r="6" fill="#28C840"/>
    <text x="440" y="25" text-anchor="middle" class="mono" font-size="12" fill="#64748B">~/joao-pedro — bash</text>

    <text x="40" y="84" class="mono line l1" font-size="15"><tspan fill="#34D399">$</tspan><tspan fill="#94A3B8"> whoami</tspan></text>

    <text x="40" y="140" class="sans line l2" font-size="46" font-weight="700" fill="#F8FAFC" letter-spacing="-1">João Pedro França</text>
    <rect x="40" y="156" width="120" height="4" rx="2" fill="url(#accent)" class="line l2"/>

    <text x="40" y="192" class="sans line l3" font-size="19" fill="#CBD5E1">Desenvolvedor Full Stack <tspan fill="#475569">·</tspan> Web &amp; Mobile</text>

    <g class="mono line l4" font-size="14">
      <text x="40" y="232" fill="#94A3B8"><tspan fill="#38BDF8">◉</tspan> Brasil</text>
      <text x="160" y="232" fill="#94A3B8"><tspan fill="#34D399">&lt;/&gt;</tspan> Next.js · React Native · Node · Python · PHP</text>
    </g>

    <text x="40" y="268" class="mono line l5" font-size="15"><tspan fill="#34D399">$</tspan><tspan fill="#94A3B8"> transformando ideias em interfaces </tspan><tspan fill="#34D399" class="cursor">▋</tspan></text>

    <g class="line l3">
      <rect x="664" y="66" width="184" height="32" rx="16" fill="#10B981" fill-opacity=".1" stroke="#10B981" stroke-opacity=".35"/>
      <circle cx="684" cy="82" r="4.5" fill="#10B981" class="pulse"/>
      <text x="698" y="87" class="sans" font-size="13" fill="#6EE7B7">aberto a oportunidades</text>
    </g>

    <g class="line l4" transform="translate(716 142)">
      <rect width="112" height="112" rx="26" fill="#FFFFFF" fill-opacity=".03" stroke="url(#accent)" stroke-opacity=".6"/>
      <text x="56" y="72" text-anchor="middle" class="mono" font-size="40" font-weight="700" fill="url(#accent)">JP</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="299" rx="17.5" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
